<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1C26" />
      <stop offset="50%" stop-color="#101117" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- Metallic Rose Gold Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5D3" />
      <stop offset="30%" stop-color="#DFC29F" />
      <stop offset="65%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7B4F" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC29F" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C5A880" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9E7B4F" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="radialShine" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="16" />
  
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="240" r="190" fill="url(#radialShine)" />

  <!-- Dual Mutual Arrows (Exchange cycle representing 2-shop balance) -->
  <!-- Top clockwise arrow -->
  <g filter="url(#shadow)">
    <path d="M 130 185 C 160 110, 310 100, 370 155" fill="none" stroke="url(#roseGold)" stroke-width="22" stroke-linecap="round" />
    <polygon points="365,120 395,168 340,172" fill="#DFC29F" />
  </g>

  <!-- Bottom clockwise arrow -->
  <g filter="url(#shadow)">
    <path d="M 382 327 C 352 402, 202 412, 142 357" fill="none" stroke="url(#roseGold)" stroke-width="22" stroke-linecap="round" />
    <polygon points="147,392 117,344 172,340" fill="#C5A880" />
  </g>

  <!-- Center Bengali Taka Symbol ৳ -->
  <text 
    x="256" 
    y="346" 
    font-family="'Segoe UI', -apple-system, Roboto, 'Noto Sans Bengali', 'Bangla MN', sans-serif" 
    font-size="240" 
    font-weight="900" 
    fill="url(#roseGold)" 
    text-anchor="middle"
    filter="url(#shadow)"
  >৳</text>
</svg>

